<!DOCTYPE html>
<html lang="en">
<head>

  <title>System Node 07 // Authorized Access Only</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <span class="status-dot"></span> [SECTOR 07 TERMINAL]
    </div>
    
    <div id="chat-box" class="chat-box">
      <div class="message bot">
        [SECURITY TERMINAL] STATUS: QUARANTINE ACTIVE > [PROMPT]: LOCAL TERMINAL LINK ESTABLISHED. ENTER EXTRACTED METADATA ACCESS KEY TO OVERRIDE SECTOR QUARANTINE.
      </div>
    </div>
    
    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="Enter passphrase..." autocomplete="off">
      <button onclick="sendMessage()">SUBMIT</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
